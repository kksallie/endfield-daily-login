name: Endfield Daily Checkin

on:
  schedule:
    # Runs every 4 hours. If it's already claimed, 
    # the script will see no 'lottie-container' and just exit.
    - cron: '0 */4 * * *'
  workflow_dispatch:
  
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Selenium
        run: pip install selenium

      - name: Run checkin script
        env:
          SKPORT_COOKIES: ${{ secrets.SKPORT_COOKIES }}
        run: python checkin.py
